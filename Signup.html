<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Fonts -->
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&amp;display=fallback">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.1/dist/css/adminlte.min.css">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .input-control input {
            border: 2px solid #f0f0f0;
            border-radius: 4px;
            display: block;
            font-size: 12px;
            padding: 10px;
            width: 100%;
        }

        .input-control input:focus {
            outline: 0;
        }

        .input-control.success input {
            border-color: #09c372;
        }

        .input-control.error input {
            border-color: #ff3860;
        }

        .input-control .error {
            color: #ff3860;
            font-size: 9px;
            height: 13px;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container bg-white rounded container-fluid mx-auto h-auto d-block"
        style="width:450px; margin-top: 5px;border-left:1px solid #ff0095;">
        <div class="d-flex justify-content-around">
            <div class="text-center mt-3">
                <h4 class="" style="margin-left: 150px;">Sign Up</h4>
            </div>
            <a href="index.html" class="btn text-white border mt-3"
                style="background-color: #ff0095; margin-left:110px; border-color: #ff0095;">Go to site</a>
        </div>
        <form id="form" name="form" action="/">
            <div class="input-control">
                <label for="username" class="form-label">First Name<span class="text-danger"> *</span></label>
                <input type="text" class="form-control" id="username" name="username">
                <div class="error"></div>
            </div>

            <div class="input-control">
                <label for="username2" class="form-label">Last Name<span class="text-danger"> *</span></label>
                <input type="text" class="form-control" id="username2" name="username2">
                <div class="error"></div>
            </div>

            <div class="input-control">
                <label for="email" class="form-label">Email<span class="text-danger"> *</span></label>
                <input type="text" class="form-control" id="email" name="email">
                <div class="error"></div>
            </div>

            <div class="input-control">
                <label for="password" class="form-label">Password<span class="text-danger"> *</span></label>
                <input type="password" class="form-control" id="password" name="password">
                <div class="error"></div>
            </div>

            <div class="mb-3 input-control">
                <label for="password2" class="form-label">Confirm Password<span class="text-danger"> *</span></label>
                <input type="password" class="form-control" id="password2" name="password2">
                <div class="error"></div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary text-light" id="submit-btn"
                    style="background-color: #ff0095; border-color: #ff0095;">Sign Up</button>
            </div>

            <div class="text-center pb-1">
                <p>Already have an account? <a href="login.html" class="text-decoration-none">Login</a></p>
            </div>
        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
    <script>
        let form = document.getElementById('form');
        let username = document.getElementById('username');
        let username2 = document.getElementById('username2');
        let email = document.getElementById('email');
        let password = document.getElementById('password');
        let password2 = document.getElementById('password2');

        form.addEventListener('submit', e => {
            e.preventDefault();

            validateInputs();

            // object name , email and pass
            let obj = {
                name: username.value,
                lastname: username2.value,
                email: email.value,
                password: password.value
            };
            // convert into object 
            //  store in session 
            sessionStorage.setItem("logindata", JSON.stringify(obj));
            // redirect login page
            let retrivedobj = JSON.parse(sessionStorage.getItem("obj"));
            if (iseror === true) {
                return
            } else {
                // sweet alert if  signup sucessfull
                Swal.fire({
                    title: "successfully Signin",
                    icon: "success",
                    draggable: true
                });
                setTimeout(() => {
                    window.location.href="login.html"
                }, 2000);
            }
        });
        // by default error is false if true then return and set error message 
        var iseror = false;
        let setError = (element, message) => {
            let inputControl = element.parentElement;
            let errorDisplay = inputControl.querySelector('.error');

            errorDisplay.innerText = message;
            inputControl.classList.add('error');
            inputControl.classList.remove('success')
            iseror = true;
            return;
        }
 // sucees make error field empty if sucees
        let setSuccess = element => {
            let inputControl = element.parentElement;
            let errorDisplay = inputControl.querySelector('.error');

            errorDisplay.innerText = '';
            inputControl.classList.add('success');
            inputControl.classList.remove('error');
        };
 // regex for email validation
        let isValidEmail = email => {
            const re = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            return re.test(String(email).toLowerCase());
        }
 // form validation check if input fieldempty or chracter less than required etc.
        let validateInputs = () => {
            iseror = false;
            let usernameValue = username.value.trim();
            let usernameValue2 = username2.value.trim();
            let emailValue = email.value.trim();
            let passwordValue = password.value.trim();
            let password2Value = password2.value.trim();

            if (usernameValue === '') {
                setError(username, 'First name is required');
            } else {
                setSuccess(username);
            }
            if (usernameValue2 === '') {
                setError(username2, 'Last name is required');
            } else {
                setSuccess(username2);
            }

            if (emailValue === '') {
                setError(email, 'Email is required');
            } else if (!isValidEmail(emailValue)) {
                setError(email, 'Provide a valid email address');
            } else {
                setSuccess(email);
            }

            if (passwordValue === '') {
                setError(password, 'Password is required');
            } else if (passwordValue.length < 8) {
                setError(password, 'Password must be at least 8 character.')
            } else {
                setSuccess(password);
            }

            if (password2Value === '') {
                setError(password2, 'Please confirm your password');
            } else if (password2Value !== passwordValue) {
                setError(password2, "Passwords doesn't match");

            } else {
                setSuccess(password2);
            }
        }

    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
